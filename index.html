<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Maps</title>
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Azure Maps - Custom Styles</h1>
        <div id="map"></div>
        <div class="controls">
            <button id="btn-road">Jalan</button>
            <button id="btn-satellite">Satelit</button>
            <button id="btn-night">Malam</button>
            <button id="btn-grayscale-light">Grayscale Light</button>
            <button id="btn-grayscale-dark">Grayscale Dark</button>
            <button id="btn-road-relief">Road Relief</button>
            <button id="btn-satellite-labels">Satelit + Label</button>
            <button id="btn-detail">Tampilkan/Sembunyikan Detail</button>
            <button id="btn-findme">Temukan Saya</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
