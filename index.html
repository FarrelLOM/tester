<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Maps</title>
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 90vh; }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            background: #0078D4;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="controls">
        <button onclick="changeMapStyle('road')">Jalan</button>
        <button onclick="changeMapStyle('satellite')">Satelit</button>
        <button onclick="changeMapStyle('night')">Malam</button>
        <button onclick="changeMapStyle('grayscale_light')">Grayscale</button>
        <button onclick="toggleLabels()">Detail</button>
    </div>

    <script>
        let map, labelLayer;

        function initMap() {
            map = new atlas.Map("map", {
                center: [106.8272, -6.1751], // Lokasi awal (Jakarta)
                zoom: 12,
                authOptions: {
                    authType: 'subscriptionKey',
                    subscriptionKey: '4i0e6UnHavG8777vBsyY3LujOC9XVRArXmxpKyk6JJrzYoP47nJtJQQJ99BCACYeBjFwNasMAAAgAZMP3rmN'
                }
            });

            map.events.add('ready', function () {
                // Tambahkan kontrol untuk zoom dan kompas
                map.controls.add([new atlas.control.ZoomControl(), new atlas.control.CompassControl()], {
                    position: "top-right"
                });
            });
        }

        function changeMapStyle(style) {
            map.setStyle(style);
        }

        function toggleLabels() {
            if (!labelLayer) {
                labelLayer = new atlas.layer.SymbolLayer(map.sources.createFromData([]), null, {
                    textOptions: { visible: true }
                });
                map.layers.add(labelLayer);
            } else {
                let isVisible = labelLayer.getOptions().textOptions.visible;
                labelLayer.setOptions({ textOptions: { visible: !isVisible } });
            }
        }

        window.onload = initMap;
    </script>

</body>
</html>
